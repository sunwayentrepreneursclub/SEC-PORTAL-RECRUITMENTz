<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEC Careers — Sunway Entrepreneurs Club</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --white:#ffffff; --bg:#f4f5f7; --border:#e0e0e0; --ink:#1a1a1a; --muted:#6b7280;
  --amber:#c2761c; --amber-deep:#8a4e0f; --amber-light:#fff3e0;
  --green:#16a34a; --green-light:#dcfce7;
  --red:#dc2626; --red-light:#fee2e2;
  --blue:#2563eb; --blue-light:#dbeafe;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--ink)}
.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}

/* ---------- layout ---------- */
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
.hidden{display:none !important}

/* ---------- navbar ---------- */
.nav{
  position:sticky;top:0;z-index:100;background:var(--white);
  border-bottom:1px solid var(--border);height:64px;
}
.nav-in{max-width:1200px;margin:0 auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:32px}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer}
.logo-box{
  width:38px;height:38px;background:#1a1a1a;border-radius:6px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex:0 0 38px;
}
.logo-box img{width:100%;height:100%;object-fit:contain}
.logo-box .fb{color:#fff;font-weight:800;font-size:12px;letter-spacing:.5px}
.brand-t1{font-weight:700;font-size:18px;line-height:1.15}
.brand-t2{font-size:11px;color:var(--muted);line-height:1.2}
.nav-links{display:flex;gap:26px;margin-left:8px}
.nav-links a{font-size:14px;font-weight:500;color:#374151;padding:4px 0;border-bottom:2px solid transparent;cursor:pointer}
.nav-links a:hover,.nav-links a.on{color:var(--amber);border-bottom-color:var(--amber)}
.nav-right{margin-left:auto;display:flex;align-items:center;gap:14px}
.nav-admin{font-size:13px;color:var(--muted);font-weight:500;cursor:pointer}
.nav-admin:hover{color:var(--amber)}
.admin-badge{
  background:var(--amber-light);color:var(--amber-deep);font-size:12px;font-weight:700;
  padding:5px 11px;border-radius:20px;border:1px solid #f0d9b8;
}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:11px 20px;border-radius:8px;font-size:14px;font-weight:600;
  transition:.16s;white-space:nowrap;
}
.btn-primary{background:var(--amber);color:#fff}
.btn-primary:hover{background:var(--amber-deep)}
.btn-primary:disabled{background:#d6d6d6;color:#8a8a8a;cursor:not-allowed}
.btn-dark{background:var(--ink);color:#fff}
.btn-dark:hover{background:#000}
.btn-ghost{background:var(--white);color:var(--ink);border:1px solid var(--border)}
.btn-ghost:hover{border-color:var(--amber);color:var(--amber)}
.btn-danger{background:var(--red);color:#fff}
.btn-danger:hover{background:#b91c1c}
.btn-sm{padding:7px 13px;font-size:13px;border-radius:6px}
.btn-block{width:100%}

/* ---------- hero ---------- */
.hero{
  background:var(--ink);color:#fff;position:relative;overflow:hidden;
  padding:64px 0 56px;
}
.hero:before{
  content:'';position:absolute;inset:0;
  background:radial-gradient(900px 380px at 12% 0%, rgba(194,118,28,.30), transparent 62%),
             radial-gradient(700px 320px at 92% 100%, rgba(194,118,28,.16), transparent 60%);
}
.hero-in{position:relative;max-width:1200px;margin:0 auto;padding:0 24px}
.eyebrow{
  display:inline-flex;align-items:center;gap:8px;background:rgba(194,118,28,.16);
  border:1px solid rgba(194,118,28,.42);color:#f0b064;font-size:12.5px;font-weight:700;
  padding:6px 14px;border-radius:20px;letter-spacing:.3px;margin-bottom:20px;
}
.dot{width:7px;height:7px;border-radius:50%;background:#f0b064;display:inline-block}
.hero h1{font-size:44px;font-weight:800;line-height:1.12;letter-spacing:-.9px;max-width:760px}
.hero p.sub{font-size:17px;color:#bfc3c9;margin-top:16px;max-width:620px;line-height:1.6}
.hero-stats{display:flex;gap:36px;margin-top:30px;flex-wrap:wrap}
.hs-n{font-size:26px;font-weight:800;color:#f0b064;line-height:1}
.hs-l{font-size:12.5px;color:#9aa0a8;margin-top:5px}
.hero .btn{margin-top:30px}

/* ---------- authority strip ---------- */
.strip{background:var(--white);border-bottom:1px solid var(--border);padding:16px 0}
.strip-in{max-width:1200px;margin:0 auto;padding:0 24px;font-size:13.5px;color:var(--muted);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.strip b{color:var(--ink);font-weight:600}

/* ---------- job layout ---------- */
.job-layout{display:grid;grid-template-columns:280px 1fr;gap:26px;padding:32px 0 60px}
.side-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:20px;margin-bottom:18px}
.side-h{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.7px;text-transform:uppercase;margin-bottom:12px}
.co-logo{width:56px;height:56px;background:var(--ink);border-radius:10px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;margin-bottom:13px}
.co-logo img{width:100%;height:100%;object-fit:contain}
.co-name{font-weight:700;font-size:16px}
.co-desc{font-size:13px;color:var(--muted);margin-top:7px;line-height:1.55}
.co-stats{margin-top:15px;padding-top:15px;border-top:1px solid var(--border)}
.co-row{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}
.co-row span:first-child{color:var(--muted)}
.co-row span:last-child{font-weight:600}
.pill-list{display:flex;flex-direction:column;gap:6px}
.pill{
  padding:9px 13px;border-radius:8px;font-size:13.5px;font-weight:500;color:#374151;
  border:1px solid transparent;text-align:left;transition:.14s;
}
.pill:hover{background:var(--bg)}
.pill.on{background:var(--amber-light);color:var(--amber-deep);font-weight:600;border-color:#f0d9b8}

.main-h{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:8px}
.main-h h2{font-size:19px;font-weight:700}
.main-h .cnt{font-size:13.5px;color:var(--muted)}

/* ---------- job card ---------- */
.jcard{
  background:var(--white);border:1px solid var(--border);border-radius:12px;
  padding:20px;margin-bottom:13px;transition:.16s;cursor:pointer;
}
.jcard:hover{border-color:var(--amber);box-shadow:0 3px 14px rgba(0,0,0,.06)}
.jc-top{display:flex;gap:14px}
.jc-logo{width:44px;height:44px;background:var(--ink);border-radius:8px;overflow:hidden;
  display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.jc-logo img{width:100%;height:100%;object-fit:contain}
.jc-id{font-size:11px;font-weight:700;color:var(--amber);letter-spacing:1px;text-transform:uppercase;
  font-family:'SFMono-Regular',Consolas,monospace}
.jc-title{font-size:16px;font-weight:700;margin-top:2px;line-height:1.3}
.jc-org{font-size:13px;color:var(--muted);margin-top:3px}
.jc-tags{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:5px}
.tag-open{background:var(--green-light);color:#15803d}
.tag-closed{background:#f1f2f4;color:#6b7280}
.tag-n{background:var(--bg);color:#4b5563;border:1px solid var(--border)}
.jc-purpose{
  font-size:13.5px;color:#4b5563;margin-top:12px;line-height:1.6;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
}
.jc-bot{display:flex;align-items:center;justify-content:space-between;margin-top:15px;
  padding-top:14px;border-top:1px solid var(--border);gap:10px;flex-wrap:wrap}
.jc-code{font-size:12px;color:var(--muted);font-family:'SFMono-Regular',Consolas,monospace;font-weight:600}

/* ---------- generic cards / pages ---------- */
.page{padding:32px 0 64px}
.card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:24px;margin-bottom:16px}
.card h3{font-size:15px;font-weight:700;margin-bottom:13px;letter-spacing:-.1px}
.card p{font-size:14.5px;color:#374151;line-height:1.7}
.card ul{margin:0;padding-left:20px}
.card li{font-size:14.5px;color:#374151;line-height:1.75;margin-bottom:6px}
.back{display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--muted);
  font-weight:500;margin-bottom:18px;cursor:pointer}
.back:hover{color:var(--amber)}

.dark-card{background:var(--ink);color:#fff;border-radius:14px;padding:34px;margin-bottom:22px;position:relative;overflow:hidden}
.dark-card:before{content:'';position:absolute;inset:0;
  background:radial-gradient(600px 260px at 10% 0%, rgba(194,118,28,.26), transparent 62%)}
.dark-card>*{position:relative}
.dark-card h1{font-size:32px;font-weight:800;letter-spacing:-.6px}
.dark-card p{color:#bfc3c9;font-size:15.5px;margin-top:11px;max-width:640px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.info-tbl{width:100%;border-collapse:collapse}
.info-tbl td{padding:11px 0;border-bottom:1px solid var(--border);font-size:14px;vertical-align:top}
.info-tbl td:first-child{color:var(--muted);width:170px;font-weight:500}
.info-tbl td:last-child{font-weight:500}
.info-tbl tr:last-child td{border-bottom:none}

.box-good{background:var(--green-light);border:1px solid #bbf7d0;border-radius:10px;padding:17px}
.box-poor{background:var(--red-light);border:1px solid #fecaca;border-radius:10px;padding:17px}
.box-good h4,.box-poor h4{font-size:12.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px}
.box-good h4{color:#15803d} .box-poor h4{color:#b91c1c}
.box-good p,.box-poor p{font-size:14px;line-height:1.65}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tg-blue{background:var(--blue-light);color:#1e40af;font-size:13px;font-weight:500;padding:7px 13px;border-radius:20px}
.tg-green{background:var(--green-light);color:#15803d;font-size:13px;font-weight:500;padding:7px 13px;border-radius:20px}

.num-card{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:13px;display:flex;gap:18px}
.num{font-size:22px;font-weight:800;color:var(--amber);font-family:'SFMono-Regular',Consolas,monospace;flex:0 0 auto;min-width:34px}
.num-card h4{font-size:15px;font-weight:700;margin-bottom:5px}
.num-card p{font-size:14px;color:#4b5563;line-height:1.65}

/* ---------- assessment ---------- */
.narrow{max-width:680px;margin:0 auto}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:#374151}
.field .req{color:var(--red)}
.inp{width:100%;padding:11px 13px;border:1px solid var(--border);border-radius:8px;
  font-size:14px;background:var(--white);transition:.14s}
.inp:focus{outline:none;border-color:var(--amber);box-shadow:0 0 0 3px rgba(194,118,28,.12)}
textarea.inp{resize:vertical;min-height:120px;line-height:1.6}
.hint{font-size:12px;color:var(--muted);margin-top:6px}
.prog-wrap{height:5px;background:var(--border);border-radius:4px;overflow:hidden;margin-bottom:22px}
.prog{height:100%;background:var(--amber);transition:width .3s ease;border-radius:4px}
.q-label{font-size:12px;font-weight:700;color:var(--amber);letter-spacing:.8px;text-transform:uppercase;margin-bottom:9px}
.q-text{font-size:18px;font-weight:700;line-height:1.45;margin-bottom:16px}
.q-nav{display:flex;gap:10px;margin-top:18px}
.spinner{width:34px;height:34px;border:3px solid var(--border);border-top-color:var(--amber);
  border-radius:50%;animation:spin .7s linear infinite;margin:0 auto 14px}
@keyframes spin{to{transform:rotate(360deg)}}
.center{text-align:center}
.check{width:72px;height:72px;border-radius:50%;background:var(--green-light);color:var(--green);
  display:flex;align-items:center;justify-content:center;font-size:34px;margin:0 auto 20px}
.qr-box{background:var(--white);border:1px solid var(--border);border-radius:14px;
  padding:22px;display:inline-block;margin:20px auto}
.qr-box img{width:220px;height:220px;display:block;object-fit:contain}
.amber-pill{display:inline-block;background:var(--amber-light);color:var(--amber-deep);
  font-size:13px;font-weight:700;padding:7px 15px;border-radius:20px;border:1px solid #f0d9b8}
.steps-card{background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:18px 22px;
  text-align:left;max-width:380px;margin:22px auto}
.steps-card div{font-size:14px;color:#374151;padding:5px 0;display:flex;gap:11px}
.steps-card b{color:var(--amber);font-weight:700}

/* ---------- admin ---------- */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:24px}
.tab{padding:12px 20px;font-size:14px;font-weight:600;color:var(--muted);
  border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--amber);border-bottom-color:var(--amber)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:13px;margin-bottom:22px}
.stat{background:var(--white);border:1px solid var(--border);border-radius:10px;padding:16px 18px}
.stat-n{font-size:26px;font-weight:800;line-height:1}
.stat-l{font-size:12px;color:var(--muted);margin-top:5px;font-weight:500}
.tbl-wrap{background:var(--white);border:1px solid var(--border);border-radius:12px;overflow:auto}
table.dt{width:100%;border-collapse:collapse;min-width:820px}
table.dt th{text-align:left;font-size:11.5px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.6px;padding:13px 15px;border-bottom:1px solid var(--border);
  background:var(--bg);white-space:nowrap}
table.dt td{padding:13px 15px;border-bottom:1px solid var(--border);font-size:13.5px;vertical-align:middle}
table.dt tr:last-child td{border-bottom:none}
table.dt tr:hover td{background:#fafbfc}
.code-badge{background:var(--amber-light);color:var(--amber-deep);font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:5px;font-family:'SFMono-Regular',Consolas,monospace}
.sw{width:40px;height:22px;border-radius:12px;background:#d1d5db;position:relative;transition:.2s;flex:0 0 40px;cursor:pointer}
.sw.on{background:var(--green)}
.sw:after{content:'';position:absolute;width:18px;height:18px;border-radius:50%;background:#fff;
  top:2px;left:2px;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on:after{left:20px}
.st{font-size:11.5px;font-weight:700;padding:4px 10px;border-radius:20px;display:inline-block}
.st-new{background:var(--blue-light);color:#1e40af}
.st-rev{background:var(--amber-light);color:var(--amber-deep)}
.st-short{background:var(--green-light);color:#15803d}
.st-rej{background:var(--red-light);color:#b91c1c}
.act{display:flex;gap:7px}
.link-b{font-size:13px;font-weight:600;color:var(--amber)}
.link-b:hover{text-decoration:underline}
.link-r{font-size:13px;font-weight:600;color:var(--red)}
.link-r:hover{text-decoration:underline}
.empty{padding:56px 24px;text-align:center;color:var(--muted);font-size:14.5px}

/* ---------- slide panel ---------- */
.ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;opacity:0;pointer-events:none;transition:.22s}
.ovl.on{opacity:1;pointer-events:auto}
.panel{position:fixed;top:0;right:0;bottom:0;width:560px;max-width:96vw;background:var(--white);
  z-index:201;transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-4px 0 24px rgba(0,0,0,.14)}
.panel.on{transform:translateX(0)}
.panel-h{padding:18px 22px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;flex:0 0 auto}
.panel-h h3{font-size:16px;font-weight:700}
.panel-x{width:32px;height:32px;border-radius:7px;background:var(--bg);display:flex;
  align-items:center;justify-content:center;font-size:19px;color:var(--muted);flex:0 0 32px}
.panel-x:hover{background:var(--border)}
.panel-b{padding:22px;overflow-y:auto;flex:1}
.qbox{background:var(--amber-light);border:1px solid #f0d9b8;border-radius:10px;padding:17px;margin:18px 0}
.qbox-h{font-size:12px;font-weight:700;color:var(--amber-deep);text-transform:uppercase;
  letter-spacing:.5px;margin-bottom:5px}
.qbox-s{font-size:12.5px;color:#8a6a3a;margin-bottom:13px;line-height:1.5}
.sw-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--border)}
.sw-row .l{font-size:14px;font-weight:600}
.sw-row .d{font-size:12.5px;color:var(--muted);margin-top:2px}
.ans-block{margin-bottom:16px}
.ans-q{font-size:13.5px;font-weight:700;margin-bottom:7px;line-height:1.5}
.ans-a{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:13px;
  font-size:14px;line-height:1.65;color:#374151;white-space:pre-wrap}

/* ---------- password overlay ---------- */
.pw-ovl{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;
  display:flex;align-items:center;justify-content:center;padding:24px}
.pw-card{background:var(--white);border-radius:14px;padding:30px;width:100%;max-width:380px;
  box-shadow:0 20px 50px rgba(0,0,0,.25)}
.pw-card h3{font-size:19px;font-weight:700;margin:14px 0 6px}
.pw-card p{font-size:13.5px;color:var(--muted);margin-bottom:20px}

/* ---------- toast ---------- */
#toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(90px);
  z-index:400;padding:13px 22px;border-radius:9px;color:#fff;font-size:14px;font-weight:600;
  transition:transform .26s cubic-bezier(.4,0,.2,1);box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw}
#toast.on{transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--green)} #toast.err{background:var(--red)} #toast.info{background:var(--ink)}

/* ---------- responsive ---------- */
@media(max-width:900px){
  .job-layout{grid-template-columns:1fr;gap:18px}
  .nav-links{display:none}
  .hero h1{font-size:31px}
  .hero{padding:44px 0 40px}
  .grid2,.grid3{grid-template-columns:1fr}
  .dark-card{padding:24px}
  .dark-card h1{font-size:25px}
  .wrap,.nav-in,.hero-in,.strip-in{padding:0 16px}
  .card{padding:18px}
  .hero-stats{gap:22px}
}
</style>
</head>
<body>

<div id="app"></div>

<div class="ovl" id="ovl" onclick="closePanel()"></div>
<div class="panel" id="panel">
  <div class="panel-h">
    <button class="panel-x" onclick="closePanel()">&times;</button>
    <h3 id="panelTitle">Panel</h3>
  </div>
  <div class="panel-b" id="panelBody"></div>
</div>

<div id="toast"></div>

<script>
/* ================================================================ CONFIG === */
const LOGO = 'logo.png';
const QR   = 'qr.png';
const ADMIN_PASSWORD = 'SECADMIN';

const DEFAULT_QUESTIONS = [
  "Why do you want this specific role at SEC — not a general answer about passion or learning?",
  "Describe something you built, organised or executed from start to finish without being told what to do. What was the outcome?",
  "What would you do in your first 30 days if selected for this role?"
];

const DEPARTMENTS = [
  'ExCo',
  'Control & Support',
  'Brand & Content (DEP-01)',
  'Partnerships & Growth (DEP-02)',
  'People & Operations (DEP-03)',
  'Events (DEP-04)',
  'Other'
];

/* ================================================================= STATE === */
const S = {
  view: 'home',
  roles: [],
  settings: {},
  assessments: [],
  loading: true,
  filterDept: 'All',
  filterStatus: 'All',
  currentRole: null,
  isAdmin: sessionStorage.getItem('sec_admin') === '1',
  adminTab: 'positions',
  showPw: false,
  aStep: 'intro',
  aName: '',
  aEmail: '',
  aQIndex: 0,
  aAnswers: []
};

/* =============================================================== HELPERS === */
const esc = s => String(s == null ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;')
  .replace(/>/g,'&gt;').replace(/"/g,'&quot;');

const jsq = s => String(s == null ? '' : s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");

function toast(msg, type){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = (type || 'info') + ' on';
  clearTimeout(t._tm);
  t._tm = setTimeout(function(){ t.className = t.className.replace(' on',''); }, 3500);
}

async function api(body){
  const res = await fetch('/api', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  const json = await res.json().catch(function(){ return {error:'Bad server response'}; });
  if (json.error) throw new Error(json.error);
  return json;
}
const adminApi = body => api(Object.assign({}, body, { adminKey: ADMIN_PASSWORD }));

function logoBox(size, extraClass){
  size = size || 38;
  const r = size >= 50 ? 10 : size >= 44 ? 8 : 6;
  const cls = 'logo-box' + (extraClass ? ' ' + extraClass : '');
  return '<div class="'+cls+'" style="width:'+size+'px;height:'+size+'px;flex:0 0 '+size+'px;border-radius:'+r+'px">'
    + '<img src="'+LOGO+'" alt="SEC" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'block\'">'
    + '<span class="fb" style="display:none;font-size:'+Math.round(size/3.2)+'px">SEC</span>'
    + '</div>';
}

function fmtDate(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});
}

function go(view, role){
  S.view = view;
  if (role !== undefined) S.currentRole = role;
  window.scrollTo(0,0);
  render();
}

function setting(key, fallback){
  const v = S.settings[key];
  return (v && String(v).trim()) ? v : fallback;
}

/* ================================================================== LOAD === */
async function loadPublic(){
  S.loading = true; render();
  try{
    const d = await api({ action:'loadPublicData' });
    S.roles = d.roles || [];
    S.settings = d.settings || {};
  }catch(e){
    toast('Could not load positions: ' + e.message, 'err');
    S.roles = [];
  }
  S.loading = false; render();
}

async function loadDashboard(){
  S.loading = true; render();
  try{
    const d = await adminApi({ action:'loadDashboard' });
    S.roles = d.roles || [];
    S.assessments = d.assessments || [];
    S.settings = d.settings || {};
  }catch(e){
    toast('Dashboard load failed: ' + e.message, 'err');
  }
  S.loading = false; render();
}

/* ================================================================ NAVBAR === */

  const links = [

    + '<div class="pw-card">'

    + 'onkeydown="if(event.key===\'Enter\')tryLogin()">'
    + '<div style="display:flex;gap:9px;margin-top:16px">'
    + '<button class="btn btn-primary" style="flex:1" onclick="tryLogin()">Sign in</button>'

function tryLogin(){
  const el = document.getElementById('pwInput');
  const v = el ? el.value : '';
  if (v === ADMIN_PASSWORD){
    S.isAdmin = true; S.showPw = false; S.view = 'admin'; S.adminTab = 'positions';
    sessionStorage.setItem('sec_admin','1');
    toast('Signed in as admin','ok');
    loadDashboard();
  } else {
    toast('Incorrect password','err');
  }
}

function exitAdmin(){
  S.isAdmin = false;
  sessionStorage.removeItem('sec_admin');
  S.view = 'home';
  loadPublic();
}

/* ============================================================= ASSESSMENT == */
function startApply(id){
  const r = S.roles.filter(function(x){return x.id===id;})[0];
  if(!r) return toast('Role not found','err');
  if(!r.isOpen) return toast('Applications are closed for this role','err');
  S.currentRole = id;
  S.aStep='intro'; S.aName=''; S.aEmail=''; S.aQIndex=0; S.aAnswers=[];
  go('assess');
}

function roleQuestions(r){
  const q = (r && r.questions && r.questions.length) ? r.questions : DEFAULT_QUESTIONS;
  return q.filter(function(x){ return x && String(x).trim(); });
}

function viewAssess(){
  const r = S.roles.filter(function(x){return x.id===S.currentRole;})[0];
  if(!r) return navbar() + '<div class="wrap page"><div class="card empty">Role not found.</div></div>';
  const qs = roleQuestions(r);

  if (S.aStep === 'intro'){
    return navbar() + '<div class="wrap page"><div class="narrow">'
      + '<a class="back" onclick="go(\'role\',\''+jsq(r.id)+'\')">&larr; Back to role</a>'
      + '<div class="card">'
      + '<div style="display:flex;gap:14px;align-items:center;margin-bottom:20px">'
      + logoBox(44)
      + '<div><div style="font-size:12.5px;color:var(--muted)">Applying for</div>'
      + '<div style="font-weight:700;font-size:16px">'+esc(r.title)+'</div></div></div>'
      + '<h3 style="font-size:18px;margin-bottom:6px">Before you begin</h3>'
      + '<p style="font-size:14px;color:var(--muted);margin-bottom:20px">You will answer '+qs.length
      + ' question'+(qs.length===1?'':'s')+'. There is no time limit. Write properly — short or generic answers will not progress.</p>'
      + '<div class="field"><label>Full name <span class="req">*</span></label>'
      + '<input class="inp" id="aName" value="'+esc(S.aName)+'" placeholder="Your full name" oninput="S.aName=this.value;syncStart()"></div>'
      + '<div class="field"><label>Email address <span class="req">*</span></label>'
      + '<input class="inp" id="aEmail" type="email" value="'+esc(S.aEmail)+'" placeholder="you@example.com" oninput="S.aEmail=this.value;syncStart()">'
      + '<div class="hint">We send your acknowledgement here.</div></div>'
      + '<button class="btn btn-primary btn-block" id="startBtn" disabled onclick="beginQuestions()">Start assessment &rarr;</button>'
      + '</div></div></div>';
  }

  if (S.aStep === 'submitting'){
    return navbar() + '<div class="wrap page"><div class="narrow">'
      + '<div class="card center" style="padding:60px 24px"><div class="spinner"></div>'
      + '<div style="font-weight:600">Submitting your answers...</div></div></div></div>';
  }

  if (S.aStep === 'done'){
    return navbar() + '<div class="wrap page"><div class="narrow">'
      + '<div class="card center" style="padding:44px 26px">'
      + '<div class="check">&#10003;</div>'
      + '<h2 style="font-size:24px;font-weight:800;letter-spacing:-.4px">Answers submitted!</h2>'
      + '<div style="margin:14px 0"><span class="amber-pill">'+esc(r.title)+'</span></div>'
      + '<p style="font-size:14.5px;color:#4b5563;max-width:440px;margin:12px auto 0;line-height:1.7">'
      + esc(S.aName)+', your assessment answers have been recorded. Complete your application by scanning the QR code below.</p>'
      + '<div class="steps-card">'
      + '<div><b>1.</b><span>Open your phone camera</span></div>'
      + '<div><b>2.</b><span>Point it at the QR code below</span></div>'
      + '<div><b>3.</b><span>Fill in the application form that opens</span></div>'
      + '</div>'
      + '<div class="qr-box"><img src="'+QR+'" alt="Application form QR code" '
      + 'onerror="this.parentElement.innerHTML=\'<div style=&quot;width:220px;height:220px;display:flex;align-items:center;justify-content:center;color:#6b7280;font-size:13px&quot;>QR code unavailable</div>\'"></div>'
      + '<p style="font-size:13.5px;color:var(--muted);margin-top:4px">&#128241; Scan with your phone camera to open the application form</p>'
      + '<div style="margin-top:24px"><button class="btn btn-ghost" onclick="go(\'home\')">Browse other roles</button></div>'
      + '</div></div></div>';
  }

  const i = S.aQIndex;
  const total = qs.length;
  const pct = Math.round((i / total) * 100);
  const cur = S.aAnswers[i] || '';
  const last = i === total - 1;

  return navbar() + '<div class="wrap page"><div class="narrow"><div class="card">'
    + '<div class="prog-wrap"><div class="prog" style="width:'+pct+'%"></div></div>'
    + '<div class="q-label">Question '+(i+1)+' of '+total+'</div>'
    + '<div class="q-text">'+esc(qs[i])+'</div>'
    + '<textarea class="inp" id="ansBox" placeholder="Write your answer here..." oninput="onAnswerInput(this.value)">'+esc(cur)+'</textarea>'
    + '<div class="hint" id="charHint">'+cur.length+' characters '
    + (cur.length<30 ? '&middot; '+(30-cur.length)+' more needed' : '&middot; ready')+'</div>'
    + '<div class="q-nav">'
    + (i>0?'<button class="btn btn-ghost" onclick="prevQ()">&larr; Previous</button>':'')
    + '<button class="btn btn-primary" id="nextBtn" style="flex:1" '
    + (cur.length<30?'disabled':'')+' onclick="'+(last?'submitAssessment()':'nextQ()')+'">'
    + (last?'Submit answers &rarr;':'Next question &rarr;')+'</button>'
    + '</div></div></div></div>';
}

function syncStart(){
  const b = document.getElementById('startBtn');
  if (b) b.disabled = !(S.aName.trim() && /\S+@\S+\.\S+/.test(S.aEmail.trim()));
}

function beginQuestions(){
  if(!S.aName.trim() || !/\S+@\S+\.\S+/.test(S.aEmail.trim()))
    return toast('Enter a valid name and email','err');
  S.aStep='questions'; S.aQIndex=0; render();
}

function onAnswerInput(v){
  S.aAnswers[S.aQIndex] = v;
  const h = document.getElementById('charHint');
  const b = document.getElementById('nextBtn');
  if (h) h.innerHTML = v.length + ' characters ' + (v.length<30 ? '&middot; '+(30-v.length)+' more needed' : '&middot; ready');
  if (b) b.disabled = v.length < 30;
}

function nextQ(){ S.aQIndex++; render(); window.scrollTo(0,0); }
function prevQ(){ S.aQIndex--; render(); window.scrollTo(0,0); }

async function submitAssessment(){
  const r = S.roles.filter(function(x){return x.id===S.currentRole;})[0];
  const qs = roleQuestions(r);
  S.aStep='submitting'; render();
  try{
    await api({
      action:'submitAssessment',
      roleId:r.id, roleCode:r.code, roleTitle:r.title,
      name:S.aName.trim(), email:S.aEmail.trim(),
      questions:qs, answers:S.aAnswers.slice(0, qs.length)
    });
    S.aStep='done'; render();
  }catch(e){
    toast('Submission failed: ' + e.message,'err');
    S.aStep='questions'; render();
  }
}

        return '<div class="num-card"><div class="num">'+x[0]+'</div>'
          + '<div><h4>'+esc(x[1])+'</h4><p>'+esc(x[2])+'</p></div></div>';
      }).join('')
    + '<div class="dark-card" style="margin-top:22px"><h1 style="font-size:22px">What you will NOT find here</h1>'
    + '<ul style="margin-top:16px;padding-left:20px;color:#bfc3c9">'
    + nots.map(function(n){ return '<li style="font-size:14.5px;line-height:1.9">'+esc(n)+'</li>'; }).join('')
    + '</ul></div></div>';
}

function viewProcess(){
  const steps = [
    ['01','Explore roles','Read the full role description. Apply for the one you actually want.'],
    ['02','Answer assessment questions','Short written answers on this portal. No time limit.'],
    ['03','Scan QR → open application form','Complete the official application form after your answers are recorded.'],
    ['04','Assessment task', setting('process_task','A short practical task relevant to the role you applied for.')],
    ['05','Interview', setting('process_interview','A conversation with the relevant HOD and an ExCo member.')],
    ['06','Selection', setting('process_selection','Outcomes communicated directly. We contact you — please do not follow up.')],
    ['07','Learning Portal + Deployment','Charter onboarding via the SEC Learning Portal, then deployment into your role.']
  ];
  return navbar() + '<div class="wrap page">'
    + '<div class="dark-card"><h1>Recruitment process</h1>'
    + '<p>Seven steps. Every applicant goes through the same process regardless of who they know.</p></div>'
    + steps.map(function(x){
        return '<div class="num-card"><div class="num">'+x[0]+'</div>'
          + '<div><h4>'+esc(x[1])+'</h4><p>'+esc(x[2])+'</p></div></div>';
      }).join('')

/* ================================================================= ADMIN == */
function viewAdmin(){
  if (!S.isAdmin){ S.view='home'; return viewHome(); }
  const tabs = [['positions','Positions'],['applications','Applications'],['settings','Settings']]
    .map(function(t){
      return '<button class="tab '+(S.adminTab===t[0]?'on':'')+'" onclick="S.adminTab=\''+t[0]+'\';render()">'+t[1]+'</button>';
    }).join('');

  let body = '';
  if (S.loading) body = '<div class="card empty"><div class="spinner"></div>Loading...</div>';
  else if (S.adminTab==='positions') body = adminPositions();
  else if (S.adminTab==='applications') body = adminApplications();
  else body = adminSettings();

  return navbar() + '<div class="wrap page">'
    + '<h1 style="font-size:26px;font-weight:800;margin-bottom:20px;letter-spacing:-.5px">Admin Dashboard</h1>'
    + '<div class="tabs">'+tabs+'</div>'+body+'</div>';
}

/* --------------------------------------------------------- admin positions */
function adminPositions(){
  const total = S.roles.length;
  const open = S.roles.filter(function(r){return r.isOpen;}).length;
  const closed = total - open;
  const hidden = S.roles.filter(function(r){return !r.visible;}).length;

  const rows = S.roles.map(function(r){
    return '<tr>'
      + '<td><span class="code-badge">'+esc(r.code||'—')+'</span></td>'
      + '<td style="font-weight:600">'+esc(r.title)+'</td>'
      + '<td style="color:var(--muted);font-size:12.5px">'+esc(r.department||'—')+'</td>'
      + '<td><div class="sw '+(r.visible?'on':'')+'" onclick="toggleRole(\''+jsq(r.id)+'\',\'visible\','+(!r.visible)+')"></div></td>'
      + '<td><div class="sw '+(r.isOpen?'on':'')+'" onclick="toggleRole(\''+jsq(r.id)+'\',\'open\','+(!r.isOpen)+')"></div></td>'
      + '<td class="mono" style="font-size:12.5px">'+esc(r.openDate||'—')+'</td>'
      + '<td class="mono" style="font-size:12.5px">'+esc(r.closeDate||'—')+'</td>'
      + '<td>'+((r.questions&&r.questions.length)
          ? '<span style="color:var(--green);font-weight:600;font-size:12.5px">'+r.questions.length+' set</span>'
          : '<span style="color:var(--muted);font-size:12.5px">Default</span>')+'</td>'
      + '<td><div class="act">'
      + '<button class="link-b" onclick="openRolePanel(\''+jsq(r.id)+'\')">Edit</button>'
      + '<button class="link-r" onclick="deleteRole(\''+jsq(r.id)+'\')">Delete</button>'
      + '</div></td></tr>';
  }).join('');

  return '<div class="stats">'
    + '<div class="stat"><div class="stat-n">'+total+'</div><div class="stat-l">Total positions</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--green)">'+open+'</div><div class="stat-l">Open</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--muted)">'+closed+'</div><div class="stat-l">Closed</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--amber)">'+hidden+'</div><div class="stat-l">Hidden</div></div>'
    + '</div>'
    + '<div style="display:flex;justify-content:flex-end;margin-bottom:14px">'
    + '<button class="btn btn-primary btn-sm" onclick="openRolePanel(null)">+ Add Position</button></div>'
    + '<div class="tbl-wrap">'
    + (total===0
        ? '<div class="empty">No positions yet. Click "Add Position" to create one.</div>'
        : '<table class="dt"><thead><tr><th>Code</th><th>Title</th><th>Department</th><th>Visible</th>'
          + '<th>Open</th><th>Open Date</th><th>Close Date</th><th>Questions</th><th>Actions</th></tr></thead>'
          + '<tbody>'+rows+'</tbody></table>')
    + '</div>';
}

async function toggleRole(id, kind, value){
  try{
    await adminApi({
      action: kind==='open' ? 'toggleRoleOpen' : 'toggleRoleVisible',
      id: id, value: value
    });
    const r = S.roles.filter(function(x){return x.id===id;})[0];
    if(r){ if(kind==='open') r.isOpen=value; else r.visible=value; }
    render();
    toast('Updated','ok');
  }catch(e){ toast('Update failed: '+e.message,'err'); }
}

async function deleteRole(id){
  const r = S.roles.filter(function(x){return x.id===id;})[0];
  if(!confirm('Delete "'+(r?r.title:'this role')+'"? This cannot be undone.')) return;
  try{
    await adminApi({ action:'deleteRole', id: id });
    S.roles = S.roles.filter(function(x){return x.id!==id;});
    render(); toast('Position deleted','ok');
  }catch(e){ toast('Delete failed: '+e.message,'err'); }
}

function openRolePanel(id){
  const r = id ? S.roles.filter(function(x){return x.id===id;})[0] : null;
  const q = (r && r.questions && r.questions.length) ? r.questions : DEFAULT_QUESTIONS;
  const v = function(x){ return esc(x||''); };
  const listVal = function(a){ return esc((a||[]).join('\n')); };

  const deptOpts = DEPARTMENTS.map(function(d){
    return '<option value="'+esc(d)+'" '+((r&&r.department===d)?'selected':'')+'>'+esc(d)+'</option>';
  }).join('');

  const html =
      '<input type="hidden" id="f_id" value="'+v(r&&r.id)+'">'
    + '<div class="field"><label>Role code</label><input class="inp" id="f_code" value="'+v(r&&r.code)+'" placeholder="R-11"></div>'
    + '<div class="field"><label>Title <span class="req">*</span></label><input class="inp" id="f_title" value="'+v(r&&r.title)+'" placeholder="Head of Partnerships"></div>'
    + '<div class="field"><label>Department</label><select class="inp" id="f_dept"><option value="">— Select —</option>'+deptOpts+'</select></div>'
    + '<div class="field"><label>Identity label</label><input class="inp" id="f_identity" value="'+v(r&&r.identity)+'" placeholder="BUILDER"></div>'
    + '<div class="field"><label>Identity description</label><textarea class="inp" id="f_identityDesc" rows="3" style="min-height:auto">'+v(r&&r.identityDesc)+'</textarea></div>'
    + '<div class="field"><label>Purpose</label><textarea class="inp" id="f_purpose" rows="3" style="min-height:auto">'+v(r&&r.purpose)+'</textarea></div>'
    + '<div class="field"><label>Responsibilities <span style="font-weight:400;color:var(--muted)">(one per line)</span></label>'
      + '<textarea class="inp" id="f_resp" rows="5" style="min-height:auto">'+listVal(r&&r.responsibilities)+'</textarea></div>'
    + '<div class="field"><label>Authority</label><textarea class="inp" id="f_auth" rows="2" style="min-height:auto">'+v(r&&r.authority)+'</textarea></div>'
    + '<div class="field"><label>Boundaries</label><textarea class="inp" id="f_bound" rows="2" style="min-height:auto">'+v(r&&r.boundaries)+'</textarea></div>'
    + '<div class="field"><label>Reporting line</label><input class="inp" id="f_report" value="'+v(r&&r.reporting)+'" placeholder="Reports to Vice President"></div>'
    + '<div class="field"><label>Weekly commitment</label><input class="inp" id="f_commit" value="'+v(r&&r.commitment)+'" placeholder="8–12 hrs/week"></div>'
    + '<div class="field"><label>Good performance looks like</label><textarea class="inp" id="f_good" rows="3" style="min-height:auto">'+v(r&&r.good)+'</textarea></div>'
    + '<div class="field"><label>Poor performance looks like</label><textarea class="inp" id="f_poor" rows="3" style="min-height:auto">'+v(r&&r.poor)+'</textarea></div>'
    + '<div class="field"><label>Useful skills <span style="font-weight:400;color:var(--muted)">(one per line)</span></label>'
      + '<textarea class="inp" id="f_skills" rows="4" style="min-height:auto">'+listVal(r&&r.skills)+'</textarea></div>'
    + '<div class="field"><label>What they will learn <span style="font-weight:400;color:var(--muted)">(one per line)</span></label>'
      + '<textarea class="inp" id="f_learns" rows="4" style="min-height:auto">'+listVal(r&&r.learns)+'</textarea></div>'
    + '<div class="grid2" style="gap:12px">'
      + '<div class="field"><label>Open date</label><input class="inp" id="f_open" value="'+v(r&&r.openDate)+'" placeholder="1 Sep 2026"></div>'
      + '<div class="field"><label>Close date</label><input class="inp" id="f_close" value="'+v(r&&r.closeDate)+'" placeholder="20 Sep 2026"></div>'
    + '</div>'
    + '<div class="qbox"><div class="qbox-h">Assessment Questions</div>'
      + '<div class="qbox-s">Candidates answer these before getting the QR code.</div>'
      + '<div class="field"><label>Question 1</label><textarea class="inp" id="f_q1" rows="2" style="min-height:auto">'+esc(q[0]||'')+'</textarea></div>'
      + '<div class="field"><label>Question 2</label><textarea class="inp" id="f_q2" rows="2" style="min-height:auto">'+esc(q[1]||'')+'</textarea></div>'
      + '<div class="field"><label>Question 3</label><textarea class="inp" id="f_q3" rows="2" style="min-height:auto">'+esc(q[2]||'')+'</textarea></div>'
      + '<div class="field" style="margin-bottom:0"><label>Question 4 <span style="font-weight:400;color:var(--muted)">(optional)</span></label>'
        + '<textarea class="inp" id="f_q4" rows="2" style="min-height:auto">'+esc(q[3]||'')+'</textarea></div>'
    + '</div>'
    + '<div class="sw-row"><div class="sw '+((!r||r.visible)?'on':'')+'" id="f_visible" onclick="this.classList.toggle(\'on\')"></div>'
      + '<div><div class="l">Visible on site</div><div class="d">Hidden roles are not shown publicly</div></div></div>'
    + '<div class="sw-row" style="margin-bottom:20px"><div class="sw '+((r&&r.isOpen)?'on':'')+'" id="f_isopen" onclick="this.classList.toggle(\'on\')"></div>'

    + '<button class="btn btn-primary btn-block" onclick="saveRole()">Save Role</button>';

  showPanel(r ? 'Edit position' : 'Add position', html);

async function saveRole(){
  const g = function(id){ const el = document.getElementById(id); return el ? el.value : ''; };
  const lines = function(id){
    return g(id).split('\n').map(function(s){return s.trim();}).filter(Boolean);
  };

  const title = g('f_title').trim();
  if(!title) return toast('Title is required','err');

  const questions = ['f_q1','f_q2','f_q3','f_q4']
    .map(g).map(function(s){return s.trim();}).filter(Boolean);

  const role = {
    id: g('f_id') || ('role_' + Date.now()),
    code: g('f_code').trim(),
    title: title,
    department: g('f_dept'),
    identity: g('f_identity').trim(),
    identityDesc: g('f_identityDesc').trim(),
    purpose: g('f_purpose').trim(),
    responsibilities: lines('f_resp'),
    authority: g('f_auth').trim(),
    boundaries: g('f_bound').trim(),
    reporting: g('f_report').trim(),
    commitment: g('f_commit').trim(),
    good: g('f_good').trim(),
    poor: g('f_poor').trim(),
    skills: lines('f_skills'),
    learns: lines('f_learns'),
    openDate: g('f_open').trim(),
    closeDate: g('f_close').trim(),
    visible: document.getElementById('f_visible').classList.contains('on'),
    isOpen: document.getElementById('f_isopen').classList.contains('on'),
    questions: questions
  };

  try{
    await adminApi({ action:'saveRole', role: role });
    closePanel();
    toast('Position saved','ok');
    loadDashboard();
  }catch(e){ toast('Save failed: '+e.message,'err'); }
}

/* ------------------------------------------------------ admin applications */
function adminApplications(){
  const A = S.assessments;
  const c = function(st){ return A.filter(function(a){ return (a.status||'New')===st; }).length; };

  const badge = function(st){
    const m = {New:'st-new',Reviewed:'st-rev',Shortlisted:'st-short',Rejected:'st-rej'};
    return '<span class="st '+(m[st]||'st-new')+'">'+esc(st||'New')+'</span>';
  };

  const rows = A.map(function(a,i){
    return '<tr>'
      + '<td style="font-weight:600">'+esc(a.name)+'</td>'
      + '<td class="mono" style="font-size:12.5px;color:var(--muted)">'+esc(a.email)+'</td>'
      + '<td>'+esc(a.roleTitle||a.roleCode||'—')+'</td>'
      + '<td style="font-size:12.5px">'+fmtDate(a.timestamp)+'</td>'
      + '<td>'+badge(a.status)+'</td>'
      + '<td><div class="act">'
      + '<button class="link-b" onclick="openAppPanel('+i+')">View</button>'
      + '<button class="link-r" onclick="deleteApp('+i+')">Delete</button>'
      + '</div></td></tr>';
  }).join('');

  return '<div class="stats">'
    + '<div class="stat"><div class="stat-n">'+A.length+'</div><div class="stat-l">Total</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--blue)">'+c('New')+'</div><div class="stat-l">New</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--amber)">'+c('Reviewed')+'</div><div class="stat-l">Reviewed</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--green)">'+c('Shortlisted')+'</div><div class="stat-l">Shortlisted</div></div>'
    + '<div class="stat"><div class="stat-n" style="color:var(--red)">'+c('Rejected')+'</div><div class="stat-l">Rejected</div></div>'
    + '</div>'
    + '<div class="tbl-wrap">'
    + (A.length===0
        ? '<div class="empty">No applications yet. They\'ll appear here when candidates submit.</div>'
        : '<table class="dt"><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Date Applied</th>'
          + '<th>Status</th><th>Actions</th></tr></thead><tbody>'+rows+'</tbody></table>')
    + '</div>';
}

function openAppPanel(i){
  const a = S.assessments[i];
  if(!a) return;
  const qs = a.questions || [];
  const ans = a.answers || [];

  const blocks = qs.map(function(q,k){
    return '<div class="ans-block"><div class="ans-q">'+(k+1)+'. '+esc(q)+'</div>'
      + '<div class="ans-a">'+esc(ans[k]||'— no answer —')+'</div></div>';
  }).join('');

  const statuses = ['New','Reviewed','Shortlisted','Rejected'];
  const btns = statuses.map(function(st){
    return '<button class="btn btn-sm '+(a.status===st?'btn-dark':'btn-ghost')+'" '
      + 'onclick="setStatus('+i+',\''+st+'\')">'+st+'</button>';
  }).join('');

  const html =
      '<div style="margin-bottom:18px">'
    + '<div style="font-size:19px;font-weight:700">'+esc(a.name)+'</div>'
    + '<div class="mono" style="font-size:13px;color:var(--muted);margin-top:3px">'+esc(a.email)+'</div>'
    + '<div style="font-size:13px;color:var(--muted);margin-top:3px">Applied '+fmtDate(a.timestamp)+'</div>'
    + '<div style="margin-top:12px"><span class="amber-pill">'+esc(a.roleTitle||a.roleCode||'—')+'</span></div>'
    + '</div>'
    + '<div style="border-top:1px solid var(--border);padding-top:16px;margin-bottom:18px">'
    + '<div class="side-h">Update status</div>'
    + '<div style="display:flex;gap:7px;flex-wrap:wrap">'+btns+'</div></div>'
    + '<div class="qbox"><div class="qbox-h">Assessment Answers</div>'
    + '<div style="margin-top:12px">'+(blocks || '<div style="font-size:13.5px;color:#8a6a3a">No answers recorded.</div>')+'</div></div>'
    + '<button class="btn btn-danger btn-block" style="margin-top:18px" onclick="deleteApp('+i+',true)">Delete applicant</button>';

  showPanel('Application', html);
}

async function setStatus(i, status){
  const a = S.assessments[i];
  try{
    await adminApi({ action:'updateAssessmentStatus', timestamp:a.timestamp, email:a.email, status:status });
    a.status = status;
    openAppPanel(i);
    render();
    toast('Status updated to ' + status,'ok');
  }catch(e){ toast('Update failed: '+e.message,'err'); }
}

async function deleteApp(i, fromPanel){
  const a = S.assessments[i];
  if(!a) return;
  if(!confirm('Delete application from '+a.name+'? This cannot be undone.')) return;
  try{
    await adminApi({ action:'deleteAssessment', timestamp:a.timestamp, email:a.email });
    S.assessments.splice(i,1);
    if(fromPanel) closePanel();
    render(); toast('Application deleted','ok');
  }catch(e){ toast('Delete failed: '+e.message,'err'); }
}

/* ----------------------------------------------------------- admin settings */
function adminSettings(){
  const f = function(key,label,ph,area){
    return '<div class="field"><label>'+esc(label)+'</label>'
      + (area
        ? '<textarea class="inp" id="s_'+key+'" rows="3" style="min-height:auto" placeholder="'+esc(ph)+'">'+esc(S.settings[key]||'')+'</textarea>'
        : '<input class="inp" id="s_'+key+'" value="'+esc(S.settings[key]||'')+'" placeholder="'+esc(ph)+'">')
      + '</div>';
  };

  return '<div class="card" style="max-width:720px"><h3>Site settings</h3>'
    + f('recruitment_title','Recruitment title / year','Open Recruitment 2026')
    + f('hero_headline','Hero headline','Build something real.',true)
    + f('hero_sub','Hero sub-text','We are recruiting people who...',true)
    + f('achievement_text','Achievement text (authority strip)','Recognised student organisation...',true)
    + f('process_task','Process — assessment task description','A short practical task...',true)
    + f('process_interview','Process — interview description','A conversation with...',true)
    + f('process_selection','Process — selection description','Outcomes communicated directly...',true)
    + f('contact_email','Contact email','sunwayentrepreneursclub@gmail.com')
    + f('instagram','Instagram handle','@sunwayentrepreneursclub')
    + '<button class="btn btn-primary" onclick="saveSettings()">Save Settings</button></div>';
}

async function saveSettings(){
  const keys = ['recruitment_title','hero_headline','hero_sub','achievement_text',
    'process_task','process_interview','process_selection','contact_email','instagram'];
  const settings = {};
  keys.forEach(function(k){
    const el = document.getElementById('s_'+k);
    if(el) settings[k] = el.value;
  });
  try{
    await adminApi({ action:'saveAllSettings', settings: settings });
    S.settings = Object.assign({}, S.settings, settings);
    toast('Settings saved','ok');
  }catch(e){ toast('Save failed: '+e.message,'err'); }
}

/* ================================================================= PANEL == */
function showPanel(title, html){
  document.getElementById('panelTitle').textContent = title;
  document.getElementById('panelBody').innerHTML = html;
  document.getElementById('panel').classList.add('on');
  document.getElementById('ovl').classList.add('on');
  document.body.style.overflow = 'hidden';
}
function closePanel(){
  document.getElementById('panel').classList.remove('on');
  document.getElementById('ovl').classList.remove('on');
  document.body.style.overflow = '';
}
document.addEventListener('keydown', function(e){
  if(e.key==='Escape'){ closePanel(); if(S.showPw){ S.showPw=false; render(); } }
});

/* ================================================================ RENDER == */
function render(){
  const views = {
    home: viewHome, role: viewRole, assess: viewAssess,
    why: viewWhy, standard: viewStandard, process: viewProcess, admin: viewAdmin
  };
  const fn = views[S.view] || viewHome;
  document.getElementById('app').innerHTML = fn() + pwOverlay();

  if (S.view==='assess' && S.aStep==='questions'){
    const t = document.getElementById('ansBox');
    if(t){ t.focus(); t.setSelectionRange(t.value.length, t.value.length); }
  }
  if (S.view==='assess' && S.aStep==='intro') syncStart();
  if (S.showPw){ const p=document.getElementById('pwInput'); if(p) p.focus(); }
}

/* ================================================================== BOOT == */
if (S.isAdmin){ S.view='admin'; loadDashboard(); }
else { loadPublic(); }
</script>
